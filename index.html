<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anvil Counter dApp</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-top: 0;
            font-size: 1.4rem;
        }

        .status {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1.25rem;
            word-break: break-all;
        }

        .display {
            background: #0f172a;
            padding: 1.25rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .display span {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .display strong {
            font-size: 2.5rem;
            color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            margin-bottom: 0.75rem;
        }

        button:hover:not(:disabled) {
            background: #2563eb;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .row {
            display: flex;
            gap: 0.5rem;
        }

        input {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
        }

        .row button {
            width: auto;
            padding: 0.75rem 1.25rem;
            margin-bottom: 0;
        }

        #log {
            margin-top: 1rem;
            font-size: 0.82rem;
            color: #cbd5e1;
            min-height: 1.2em;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Local Anvil Counter</h1>
        <div class="status" id="walletStatus">Not connected</div>

        <button id="connectBtn">Connect MetaMask</button>

        <div class="display">
            <span>On-Chain Number</span>
            <strong id="numberValue">—</strong>
        </div>

        <button id="incrementBtn" disabled>Increment (+1)</button>

        <div class="row">
            <input type="number" id="newNumberInput" placeholder="Enter new number" />
            <button id="setBtn" disabled>Set</button>
        </div>

        <div id="log"></div>
    </div>

    <script type="module">
        import { ethers } from "https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.min.js";

        // Replace with your exact Deployed to: address if different
        const CONTRACT_ADDRESS = "0x5FbDB2315678afecb367f032d93F642f64180aa3";

        // Human-readable ABI matching your Counter.sol
        const CONTRACT_ABI = [
            "function number() view returns (uint256)",
            "function setNumber(uint256 newNumber)",
            "function increment()"
        ];

        const ANVIL_CHAIN_ID_HEX = "0x7a69"; // 31337 in hex

        let provider, signer, contract;

        const connectBtn = document.getElementById("connectBtn");
        const incrementBtn = document.getElementById("incrementBtn");
        const setBtn = document.getElementById("setBtn");
        const numberValue = document.getElementById("numberValue");
        const walletStatus = document.getElementById("walletStatus");
        const newNumberInput = document.getElementById("newNumberInput");
        const logEl = document.getElementById("log");

        function setLog(msg) {
            logEl.textContent = msg;
        }

        async function switchToAnvil() {
            try {
                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: ANVIL_CHAIN_ID_HEX }],
                });
            } catch (err) {
                // Error 4902 means Anvil isn't added to MetaMask yet
                if (err.code === 4902) {
                    await window.ethereum.request({
                        method: "wallet_addEthereumChain",
                        params: [{
                            chainId: ANVIL_CHAIN_ID_HEX,
                            chainName: "Anvil Localhost",
                            rpcUrls: ["http://127.0.0.1:8545"],
                            nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }
                        }],
                    });
                } else {
                    throw err;
                }
            }
        }

        async function refreshNumber() {
            const current = await contract.number();
            numberValue.textContent = current.toString();
        }

        connectBtn.addEventListener("click", async () => {
            if (!window.ethereum) {
                setLog("MetaMask not detected. Please install the MetaMask browser extension.");
                return;
            }

            try {
                setLog("Connecting...");
                await switchToAnvil();

                provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                const address = await signer.getAddress();

                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                walletStatus.textContent = `Connected: ${address.slice(0, 6)}...${address.slice(-4)} (Chain 31337)`;
                connectBtn.textContent = "Connected";
                connectBtn.disabled = true;
                incrementBtn.disabled = false;
                setBtn.disabled = false;

                await refreshNumber();
                setLog("Ready.");
            } catch (err) {
                setLog(`Error: ${err.message}`);
            }
        });

        incrementBtn.addEventListener("click", async () => {
            try {
                setLog("Waiting for MetaMask signature...");
                const tx = await contract.increment();
                setLog(`Transaction sent (${tx.hash.slice(0, 10)}...). Confirming...`);
                await tx.wait();
                await refreshNumber();
                setLog("Incremented successfully!");
            } catch (err) {
                setLog(`Transaction failed: ${err.shortMessage || err.message}`);
            }
        });

        setBtn.addEventListener("click", async () => {
            const val = newNumberInput.value;
            if (val === "") return;

            try {
                setLog("Waiting for MetaMask signature...");
                const tx = await contract.setNumber(BigInt(val));
                setLog(`Transaction sent (${tx.hash.slice(0, 10)}...). Confirming...`);
                await tx.wait();
                await refreshNumber();
                newNumberInput.value = "";
                setLog(`Updated number to ${val}!`);
            } catch (err) {
                setLog(`Transaction failed: ${err.shortMessage || err.message}`);
            }
        });
    </script>
</body>

</html>
